name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# La version d'Ubuntu est figée volontairement : le job « application »
# compile contre la WebKitGTK du système, dont le nom de paquet change
# d'une distribution à l'autre, alors que « ubuntu-latest » bascule de
# version sans modification du dépôt.
jobs:
  backend:
    name: Backend Go
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances du frontend
        working-directory: frontend
        run: npm ci

      # main.go déclare « //go:embed frontenddist » : sans ce dossier,
      # le compilateur refuse de construire le paquet principal. Le
      # dossier étant ignoré par git, il faut le régénérer avant vet/tests.
      - name: Générer les ressources embarquées
        working-directory: frontend
        run: npm run build:wails

      - name: Installer Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Vérifier le formatage (gofmt)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Fichiers non formattés :"
            echo "$unformatted"
            exit 1
          fi

      - name: Vérifier le code (go vet)
        run: go vet ./...

      - name: Exécuter les tests
        run: go test ./...

  frontend:
    name: Frontend Svelte
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types (svelte-check)
        run: npm run check

      - name: Compiler le frontend
        run: npm run build

  application:
    name: Application (Wails)
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Wails déclenche lui-même « npm run build:wails » : vite doit
      # donc être installé avant la compilation.
      - name: Installer les dépendances du frontend
        working-directory: frontend
        run: npm ci

      - name: Installer les bibliothèques de compilation
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev

      # Wails interroge « webkit2gtk-4.0 », absent des distributions
      # récentes. On pointe le nom attendu vers la 4.1 effectivement
      # installée : API compatible pour le runtime utilisé ici.
      - name: Créer le pont pkg-config webkit2gtk-4.0
        run: |
          mkdir -p "$RUNNER_TEMP/pc"
          cat > "$RUNNER_TEMP/pc/webkit2gtk-4.0.pc" <<'EOF'
          prefix=/usr
          exec_prefix=${prefix}
          libdir=/usr/lib
          includedir=${prefix}/include
          revision=tarball

          Name: WebKitGTK
          Description: Web content engine for GTK
          URL: https://webkitgtk.org
          Version: 2.54.1
          Requires: glib-2.0 gtk+-3.0 libsoup-3.0 javascriptcoregtk-4.1
          Libs: -L${libdir} -lwebkit2gtk-4.1
          Cflags: -I${includedir}/webkitgtk-4.1
          EOF

      - name: Installer Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # La CLI est épinglée (et non @latest) : la version doit rester
      # compatible avec le compilateur Go du runner. La bibliothèque
      # elle-même reste celle de go.mod.
      - name: Installer la CLI Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Compiler l'application
        working-directory: backend
        env:
          PKG_CONFIG_PATH: ${{ runner.temp }}/pc
        run: "$(go env GOPATH)/bin/wails build"

      - name: Vérifier la sortie
        run: |
          test -x backend/build/bin/notecore
          ls -lh backend/build/bin/notecore
